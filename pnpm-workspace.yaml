packages:
  - '.'
  - '!test/fixtures/**'
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - case-police
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
allowBuilds:
  esbuild: true
  msw: true
  tree-sitter-python: true
  tree-sitter-ruby: true
  unrs-resolver: true
overrides:
  # Possibly related: https://github.com/101arrowz/fflate/discussions/209
  fflate: 0.8.2
