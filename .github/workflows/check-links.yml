name: Check Links

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Resolves link check parameters. Homepage and visibility come from the
  # API rather than the event payload: github.event.repository does not
  # exist on schedule events. Path globs and skip patterns come from an
  # optional linkinator.config.json at the repository root — resolved here
  # rather than by the linkinator action itself because action inputs
  # (most of which have baked-in defaults) always override that file.
  # Logs every decision so a skipped job is diagnosable from the log.
  meta:
    name: Resolve link check parameters
    runs-on: ubuntu-latest
    outputs:
      links-to-skip: ${{ steps.meta.outputs.links-to-skip }}
      paths: ${{ steps.meta.outputs.paths }}
      check-website: ${{ steps.meta.outputs.check-website }}
      homepage: ${{ steps.meta.outputs.homepage }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: linkinator.config.json
          sparse-checkout-cone-mode: false

      - name: Resolve
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_json="$(gh api "repos/${GITHUB_REPOSITORY}")"
          homepage="$(jq -r '.homepage // empty' <<<"$repo_json")"
          private="$(jq -r '.private' <<<"$repo_json")"
          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          # Private repos: every self-referential URL (pages, badges, raw
          # content) 404s for unauthenticated clients, so skip the prefix.
          links_to_skip=''
          if [[ "$private" == 'true' ]]; then
            escaped_repo="${GITHUB_REPOSITORY//./\\.}"
            escaped_server="${GITHUB_SERVER_URL//./\\.}"
            links_to_skip="^${escaped_server}/${escaped_repo}(/|$) ^https://raw\.githubusercontent\.com/${escaped_repo}/"
          fi

          # Merge path globs and skip patterns from the repository's
          # linkinator.config.json, if present. Every glob must match at
          # least one file (linkinator errors on empty globs), and values
          # must not contain spaces or commas (the action splits its list
          # inputs on both).
          paths='**/*.md'
          if [[ -f linkinator.config.json ]]; then
            config_paths="$(jq -r '(.path // empty) | if type == "array" then join(" ") else . end' linkinator.config.json)"
            if [[ -n "$config_paths" ]]; then
              paths="$config_paths"
            fi
            config_skips="$(jq -r '(.skip // empty) | if type == "array" then join(" ") else . end' linkinator.config.json)"
            if [[ -n "$config_skips" ]]; then
              links_to_skip="${links_to_skip:+${links_to_skip} }${config_skips}"
            fi
          fi

          check_website='false'
          if [[ -n "$homepage" && "${homepage%/}" != "$repo_url" ]]; then
            check_website='true'
          fi

          {
            echo "links-to-skip=${links_to_skip}"
            echo "paths=${paths}"
            echo "check-website=${check_website}"
            echo "homepage=${homepage}"
          } >>"$GITHUB_OUTPUT"

          echo "homepage: ${homepage:-<unset>}"
          echo "private: ${private}"
          echo "check-website: ${check_website}"
          echo "paths: ${paths}"
          echo "links-to-skip: ${links_to_skip:-<none>}"

  # Checks for broken links in all the repository's Markdown files
  check-repo-links:
    name: Check Repository Links
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Repository Links
        uses: JustinBeckwith/linkinator-action@36a0bfbfecd5e237e8f8531537a693616c505faf # v2.4.5
        with:
          # Repository-specific path globs and skip patterns live in
          # linkinator.config.json; the meta job merges them with the
          # privacy-derived skips. They must be passed as inputs here
          # because the action's inputs take precedence over that file.
          paths: ${{ needs.meta.outputs.paths }}
          linksToSkip: ${{ needs.meta.outputs.links-to-skip }}
          checkFragments: true
          redirects: error
          requireHttps: error
          retry: true
          retryErrors: true
          # Many links to a single host at the default concurrency (100)
          # trip rate limits (e.g. github.com's secondary limit), and each
          # request has no timeout by default, so one unresponsive host can
          # stall the job. Cap both to keep the run bounded.
          concurrency: 25
          timeout: 30000
          # Enforce only permanent redirects. statusCodes is consulted
          # before the redirects:error rule, so mapping the temporary codes
          # (302/303/307) to warn lets them pass while 301/308 still fail.
          # 429 (rate limited) is skipped.
          statusCodes: '{"302":"warn", "303":"warn", "307":"warn", "429":"skip"}'
          verbosity: INFO

  # Checks for broken links on the repository's website. Remote URL scan:
  # no checkout needed, all configuration is inline.
  check-website-links:
    name: Check Website Links
    needs: meta
    if: needs.meta.outputs.check-website == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check Website Links
        uses: JustinBeckwith/linkinator-action@36a0bfbfecd5e237e8f8531537a693616c505faf # v2.4.5
        with:
          paths: ${{ needs.meta.outputs.homepage }}
          linksToSkip: ${{ needs.meta.outputs.links-to-skip }}
          recurse: true
          concurrency: 20
          timeout: 30000
          checkFragments: true
          redirects: error
          requireHttps: error
          retry: true
          retryErrors: true
          # Same permanent-redirect-only policy as the repository scan.
          statusCodes: '{"302":"warn", "303":"warn", "307":"warn", "429":"skip"}'
          verbosity: INFO
