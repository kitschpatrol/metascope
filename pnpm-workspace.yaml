allowBuilds:
  esbuild: true
  tree-sitter-python: false
  tree-sitter-ruby: false
ignoreWorkspaceRootCheck: true
overrides:
  # Fix GHSA-3g3m-2fjr-6pw4 (glob) and GHSA-g3hv-75wg-m249 (minimatch).
  # Remove each override when its parent accepts the patched major.
  '@npmcli/map-workspaces@3.0.6>glob': 14.0.6
  '@npmcli/map-workspaces@3.0.6>minimatch': 11.0.8
  '@npmcli/package-json@5.2.1>glob': 14.0.6
  '@typescript-eslint/typescript-estree@8.72.2>minimatch': 11.0.8
  unified-engine@11.2.2>glob: 14.0.6
packages:
  - '!test/fixtures/**'
  - '.'
peerDependencyRules:
  allowedVersions:
    # Remove once the installed version declares ESLint 10 support.
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/issues/1075
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/pull/1081
    eslint-plugin-jsx-a11y@6>eslint: ^10.0.0
permissions:
  '@kitschpatrol/shared-config':
    skills: true
  tsdown:
    skills: true
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
  - 'case-police'
skills:
  dirs:
    - .agents/skills
