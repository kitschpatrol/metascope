name: Check Links

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Runs linkinator directly (not via the linkinator-action, whose defaulted
# inputs always override config files). Each scan merges an optional config
# file at the repository root over the YAML defaults below — deep merge,
# file wins, and any option linkinator supports may be used:
#   - linkinator.config.json          repository Markdown scan
#   - linkinator.website.config.json  website scan
#
# Default policy notes:
#   - Only permanent redirects fail: statusCodes is consulted before the
#     redirects:error rule, so temporary codes (302/303/307) pass as
#     warnings while 301/308 fail. 429 (rate limited) is skipped.
#   - Conservative concurrency plus a request timeout keep runs bounded:
#     high concurrency trips rate limits (e.g. github.com's secondary
#     limit) and linkinator's default timeout of 0 lets one unresponsive
#     host stall the job.
#   - Every path glob must match at least one file; linkinator errors on
#     globs with zero results.

jobs:
  check-links:
    name: Check Links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LINKINATOR_VERSION: 8.0.2
      REPO_DEFAULTS: |
        path: ['**/*.md']
        markdown: true
        concurrency: 25
        timeout: 30000
        retry: true
        retryErrors: true
        checkFragments: true
        requireHttps: error
        redirects: error
        statusCodes: { '302': warn, '303': warn, '307': warn, '429': skip }
        verbosity: INFO
      WEBSITE_DEFAULTS: |
        recurse: true
        concurrency: 20
        timeout: 30000
        retry: true
        retryErrors: true
        checkFragments: true
        requireHttps: error
        redirects: error
        statusCodes: { '302': warn, '303': warn, '307': warn, '429': skip }
        verbosity: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Homepage and visibility come from the API rather than the event
      # payload: github.event.repository does not exist on schedule events.
      # Private repos: every self-referential URL (pages, badges, raw
      # content) 404s for unauthenticated clients, so skip the prefix.
      - name: Resolve repository metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo_json="$(gh api "repos/${GITHUB_REPOSITORY}")"
          homepage="$(jq -r '.homepage // empty' <<<"$repo_json")"
          private="$(jq -r '.private' <<<"$repo_json")"
          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          privacy_skips='[]'
          if [[ "$private" == 'true' ]]; then
            escaped_repo="${GITHUB_REPOSITORY//./\\.}"
            escaped_server="${GITHUB_SERVER_URL//./\\.}"
            privacy_skips="$(jq -cn \
              --arg a "^${escaped_server}/${escaped_repo}(/|\$)" \
              --arg b "^https://raw\\.githubusercontent\\.com/${escaped_repo}/" \
              '[$a, $b]')"
          fi

          check_website='false'
          if [[ -n "$homepage" && "${homepage%/}" != "$repo_url" ]]; then
            check_website='true'
          fi

          {
            echo "privacy-skips=${privacy_skips}"
            echo "check-website=${check_website}"
            echo "homepage=${homepage}"
          } >>"$GITHUB_OUTPUT"

          echo "homepage: ${homepage:-<unset>}"
          echo "private: ${private}"
          echo "check-website: ${check_website}"
          echo "privacy-skips: ${privacy_skips}"

      - name: Check repository links
        env:
          PRIVACY_SKIPS: ${{ steps.meta.outputs.privacy-skips }}
        run: |
          config='{}'
          [[ -f linkinator.config.json ]] && config="$(<linkinator.config.json)"
          jq -n --argjson d "$(yq -o=json <<<"$REPO_DEFAULTS")" --argjson c "$config" --argjson p "$PRIVACY_SKIPS" \
            '$d * $c | .path |= (if type == "array" then . else [.] end) | .skip = ((.skip // []) + $p)' \
            >/tmp/repo-config.json
          echo "Resolved config: $(jq -c . /tmp/repo-config.json)"
          readarray -t paths < <(jq -r '.path[]' /tmp/repo-config.json)
          npx --yes "linkinator@${LINKINATOR_VERSION}" "${paths[@]}" --config /tmp/repo-config.json

      - name: Check website links
        if: steps.meta.outputs.check-website == 'true'
        env:
          PRIVACY_SKIPS: ${{ steps.meta.outputs.privacy-skips }}
          HOMEPAGE: ${{ steps.meta.outputs.homepage }}
        run: |
          config='{}'
          [[ -f linkinator.website.config.json ]] && config="$(<linkinator.website.config.json)"
          jq -n --argjson d "$(yq -o=json <<<"$WEBSITE_DEFAULTS")" --argjson c "$config" --argjson p "$PRIVACY_SKIPS" \
            '$d * $c | del(.path) | .skip = ((.skip // []) + $p)' \
            >/tmp/website-config.json
          echo "Resolved config: $(jq -c . /tmp/website-config.json)"
          npx --yes "linkinator@${LINKINATOR_VERSION}" "$HOMEPAGE" --config /tmp/website-config.json
